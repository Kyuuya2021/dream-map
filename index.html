<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dream Map Project 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        /* ▼▼▼ デザインシステム：Prism & White Space ▼▼▼ */
        :root {
            --gradient-main: linear-gradient(135deg, #6a11cb 0%, #2575fc 25%, #00b09b 50%, #f6d365 75%, #ff5252 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #333333;
            --text-sub: #666666;
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body { margin: 0; padding: 0; background: #f5f5f5; font-family: 'Zen Maru Gothic', sans-serif; overflow: hidden; color: var(--text-main); }
        
        /* 地図タイル：明るくクリーンな「余白」のある地図 */
        .leaflet-tile-pane { filter: saturate(0.8) brightness(1.05); } 
        #map { height: 100vh; width: 100%; z-index: 1; background: #f0f0f0; cursor: grab; }
        .crosshair-cursor { cursor: crosshair !important; }

        /* ガラス共通設定 (White Glass) */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            color: var(--text-main);
            border-radius: 20px;
        }

        /* ヘッダーエリア */
        .header-area { position: absolute; top: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        
        /* タイトルロゴ風 */
        .title-box { padding: 16px 24px; pointer-events: auto; border-left: 6px solid; border-image: var(--gradient-main) 1; border-left-width: 6px; border-style: solid; border-top: none; border-right: none; border-bottom: none; border-radius: 8px; background: rgba(255,255,255,0.9); }
        .title-box h1 {
            margin: 0; font-size: 24px; font-family: 'Noto Sans JP', sans-serif; font-weight: 800;
            background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }
        .title-box p { margin: 6px 0 0; font-size: 11px; color: var(--text-sub); font-family: 'Noto Sans JP', sans-serif; font-weight: 500; }

        /* ユーザープロフィール */
        .user-profile {
            display: none; align-items: center; gap: 12px; padding: 6px 16px; border-radius: 50px;
            background: rgba(255, 255, 255, 0.95); width: fit-content; pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #fff;
        }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; background-image: var(--gradient-main); background-origin: border-box; background-clip: content-box, border-box; }
        .user-name { font-size: 13px; color: #444; font-weight: bold; }
        
        .fly-btn {
            background: var(--gradient-main); border-radius: 20px; padding: 6px 14px;
            font-size: 11px; color: #fff; cursor: pointer; border: none; font-weight: bold;
            transition: all 0.3s; box-shadow: 0 4px 10px rgba(100, 100, 255, 0.2);
        }
        .fly-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(100, 100, 255, 0.3); }
        .logout-btn { font-size: 11px; color: #999; text-decoration: none; cursor: pointer; margin-left: 5px; transition: color 0.2s;}
        .logout-btn:hover { color: #555; text-decoration: underline; }

        /* 下部Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 40px; padding: 8px 16px;
            display: flex; align-items: center; gap: 4px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); transition: all 0.3s ease;
        }
        .dock:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15); }
        .dock-divider { width: 1px; height: 24px; background: #ddd; margin: 0 10px; flex-shrink: 0; }
        
        .dock-btn {
            width: 48px; height: 48px; border-radius: 50%; background: transparent; border: none;
            color: #555; display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s ease; position: relative; flex-shrink: 0;
        }
        .dock-btn:hover { background: #f0f0f0; transform: scale(1.1); color: #000; }
        .dock-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        /* 登録ボタンは特別にグラデーション */
        .dock-btn.register { color: #fff; background: var(--gradient-main); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .dock-btn.register:hover { transform: scale(1.1) rotate(90deg); }

        .dock-music {
            display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px;
            cursor: pointer; border-radius: 24px; transition: background 0.25s ease; flex-shrink: 0;
        }
        .dock-music:hover { background: #f7f7f7; }
        .sound-wave { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
        .bar { width: 3px; background: #ccc; border-radius: 2px; height: 4px; transition: background 0.3s; }
        .dock-music.playing .bar { background: #2575fc; animation: equalizer 1s infinite ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.0s; } .bar:nth-child(2) { animation-delay: 0.2s; } .bar:nth-child(3) { animation-delay: 0.4s; } .bar:nth-child(4) { animation-delay: 0.1s; }
        @keyframes equalizer { 0% { height: 4px; } 50% { height: 18px; } 100% { height: 4px; } }
        .track-info { display: flex; flex-direction: column; line-height: 1.3; }
        .track-title { font-size: 13px; font-weight: bold; color: #333; font-family: 'Noto Sans JP', sans-serif; }
        .track-status { font-size: 10px; color: #999; font-family: sans-serif; letter-spacing: 0.5px; }

        /* モーダル (White Glass) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); z-index: 2000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .glass-modal {
            width: 90%; max-width: 440px; max-height: 90vh; 
            background: #fff;
            border: 1px solid #eee; border-radius: 24px; padding: 32px;
            color: #333; display: flex; flex-direction: column; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .modal-close {
            position: absolute; top: 20px; right: 20px; width: 32px; height: 32px; border-radius: 50%;
            background: #f5f5f5; border: none; color: #555; cursor: pointer; font-size: 18px; transition: all 0.2s;
        }
        .modal-close:hover { background: #eee; transform: rotate(90deg); }

        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; font-family: 'Noto Sans JP', sans-serif; font-weight: bold; letter-spacing: 1px; }
        .glass-input, .glass-textarea {
            width: 100%; box-sizing: border-box; background: #f9f9f9;
            border: 2px solid #eee; border-radius: 12px; padding: 14px; color: #333; font-size: 16px; font-family: 'Zen Maru Gothic', sans-serif;
            transition: all 0.3s;
        }
        .glass-input:focus, .glass-textarea:focus { outline: none; border-color: #2575fc; background: #fff; box-shadow: 0 4px 15px rgba(37, 117, 252, 0.1); }
        .glass-textarea { min-height: 120px; resize: vertical; }

        .submit-btn {
            width: 100%; padding: 16px; border-radius: 50px; border: none;
            background: var(--gradient-main); color: #fff; font-weight: bold; cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif; margin-top: 10px; font-size: 16px;
            box-shadow: 0 10px 20px rgba(37, 117, 252, 0.2); transition: all 0.3s;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(37, 117, 252, 0.3); }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        
        .login-required { text-align: center; padding: 20px; }
        .google-btn {
            background: #fff; color: #555; padding: 12px 24px; border-radius: 50px; border: 1px solid #ddd; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 12px; margin: 24px auto; cursor: pointer; transition: all 0.2s;
        }
        .google-btn:hover { background: #f9f9f9; border-color: #ccc; }

        /* ▼▼▼ 追加：ゲストボタンのデザイン ▼▼▼ */
        .guest-btn {
            background: transparent; color: #666; 
            padding: 10px 24px; border-radius: 50px; border: 1px solid #ccc;
            font-size: 12px; font-weight: bold; font-family: 'Noto Sans JP', sans-serif;
            display: flex; align-items: center; justify-content: center; 
            margin: 10px auto; cursor: pointer; transition: all 0.2s;
        }
        .guest-btn:hover { background: #eee; border-color: #bbb; color: #333; }

        /* ポップアップ */
        .leaflet-popup-content-wrapper { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: none; border-radius: 16px; padding: 0; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .leaflet-popup-tip { background: #fff; }
        .dream-popup-header { background: #f9f9f9; padding: 14px; text-align: center; border-bottom: 1px solid #eee; }
        .dream-nickname { font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: #333; font-weight: bold; }
        .dream-body { padding: 20px; text-align: center; color: #444; }
        .dream-text { font-size: 16px; font-weight: bold; margin-bottom: 16px; font-family: 'Zen Maru Gothic', sans-serif; line-height: 1.8; }
        .dream-address { font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 10px; font-family: 'Noto Sans JP', sans-serif; }
        .dream-img {
            width: 100%; height: auto; max-height: 250px; object-fit: contain;
            display: block; border-radius: 8px; margin-bottom: 15px;
            background: #f0f0f0;
        }
        
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #333; font-family: 'Noto Sans JP', sans-serif; transition: opacity 0.5s; }
        
        /* ピンアイコン (SVG Gradient) */
        .custom-div-icon { background: transparent; border: none; }
        .pin-icon { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .pin-icon:hover { transform: scale(1.2) translateY(-5px); }
        
        /* 自分のアイコン (特別な輝き) */
        .my-icon-wrapper { position: relative; }
        .my-icon-svg { filter: drop-shadow(0 0 10px rgba(37, 117, 252, 0.6)); animation: float 3s infinite ease-in-out; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

    </style>
</head>
<body>

<audio id="bgm" loop><source src="bgm.mp3" type="audio/mp3"></audio>
<div id="loading"><div>WORLD LOADING...</div></div>

<div class="header-area">
    <div class="title-box glass-panel">
        <h1>Dream Map PROJECT</h1>
        <p>夢を、この世界の "ど真ん中" に走らせる。</p>
    </div>
    <div id="userProfile" class="user-profile">
        <img id="userAvatar" class="user-avatar" src="" alt="user">
        <span id="userName" class="user-name"></span>
        <button class="fly-btn" onclick="flyToMyDream()">My Dream</button>
        <a class="logout-btn" onclick="logout()">Log out</a>
    </div>
</div>

<div class="dock">
    <button class="dock-btn reset" onclick="resetView()" title="全体を見る">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
    </button>
    <div class="dock-divider"></div>
    <div class="dock-music" onclick="toggleBGM()">
        <div class="sound-wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="track-info"><div class="track-title">Dream Map BGM</div><div class="track-status" id="track-status">Tap to Play</div></div>
    </div>
    <div class="dock-divider"></div>
    <button class="dock-btn register" onclick="startRegistration()" title="夢を登録">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
</div>

<div class="modal-overlay" id="registerModal">
    <div class="glass-modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div id="loginView" class="login-required">
            <h2 style="font-family:'Noto Sans JP'; color:#333;">Welcome Dreamer</h2>
            <p style="font-size:13px; color:#666; line-height:1.6;">冒険の記録を残すには<br>ログインが必要です。</p>
            
            <button class="google-btn" onclick="login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Googleでログイン
            </button>
            
            <div style="font-size:10px; color:#aaa; margin:5px 0;">or</div>
            <button class="guest-btn" onclick="loginAnonymously()">
                登録せずにゲストとして参加
            </button>
        </div>
        <div id="formView" style="display:none;">
            <h2 style="text-align:center; font-family:'Noto Sans JP', sans-serif; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top:0;">Dream Entry</h2>
            <div class="form-group"><label class="form-label">NICKNAME</label><input type="text" id="inputName" class="glass-input" placeholder="あなたの名前" required></div>
            <div class="form-group"><label class="form-label">YOUR DREAM</label><textarea id="inputDream" class="glass-textarea" placeholder="ここにあなたの夢を描いてください..." required></textarea></div>
            <div class="form-group"><label class="form-label">PHOTO (Optional)</label><input type="file" id="inputPhoto" class="glass-input" accept="image/*" style="padding:10px;"></div>
            <input type="hidden" id="inputLatLon">
            <button id="submitBtn" class="submit-btn" onclick="submitDream()">夢を地図に刻む</button>
        </div>
        <div id="successView" style="display:none; text-align:center; padding:40px 0;">
            <svg style="width:80px; height:80px; margin-bottom:20px;" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" /><stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" /></linearGradient></defs>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <div style="font-size:18px; font-weight:bold; color:#333; margin:20px 0;">夢が地図に刻まれました</div>
            <p style="font-size:13px; color:#666;">あなたの物語が、世界の余白を彩ります。</p>
            <button class="submit-btn" onclick="closeModal()" style="background:#555; color:#fff; margin-top:20px;">閉じる</button>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
    // ▼▼▼ 設定エリア ▼▼▼
    
    // 1. GASのURL
    const API_URL = "https://script.google.com/macros/s/AKfycbyHL2RHcFwUSELpPxxmyP_dZuKeKJq_rj5gM-FLEfYSs7fk4Jkezjkgt-YlHutvCKfr/exec";

    // 2. Firebaseの設定
    const firebaseConfig = {
        apiKey: "AIzaSyAgS7KaT_iTuvrtBfggMRUCHBqcvqrShWQ",
        authDomain: "dream-quest-2026.firebaseapp.com",
        projectId: "dream-quest-2026",
        storageBucket: "dream-quest-2026.firebasestorage.app",
        messagingSenderId: "98720277386",
        appId: "1:98720277386:web:90b5564816ec9f1ab75e73"
    };
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const storage = firebase.storage();
    let currentUser = null;
    let allDreams = [];
    let myDreamCoords = null;

    // ▼▼▼ 認証ロジック ▼▼▼

    // 1. 監視ロジック（ゲストの場合の対応を追加）
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            
            // ゲストユーザーならデフォルトの名前とアイコンを使う
            const displayName = user.displayName || "Guest Dreamer";
            const photoURL = user.photoURL || "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/person.svg";

            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('userAvatar').src = photoURL;
            document.getElementById('userName').innerText = displayName;
            
            // フォームの名前欄：ゲストなら空欄にしておく（入力してもらうため）
            document.getElementById('inputName').value = user.isAnonymous ? "" : displayName;
            
            if(document.getElementById('registerModal').classList.contains('active')){
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('formView').style.display = 'block';
            }
            renderPins();
        } else {
            currentUser = null;
            myDreamCoords = null;
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('formView').style.display = 'none';
            renderPins();
        }
    });

    // 既存のGoogleログイン
    function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result)=>{
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        }).catch((error) => alert("ログインエラー: " + error.message));
    }

    // 追加：ゲストログイン関数
    function loginAnonymously() {
        auth.signInAnonymously().then(() => {
            // 成功すると自動的に onAuthStateChanged が動くので何もしなくてOK
        }).catch((error) => {
            alert("ゲスト参加エラー: " + error.message);
        });
    }

    function logout() { auth.signOut(); closeModal(); }

    // 地図スタイル：明るい「Positron」タイル（余白の表現）
    const map = L.map('map', { zoomControl: false }).setView([36.5, 138], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', { 
        attribution: '&copy; CARTO', maxZoom: 20 
    }).addTo(map);

    // SVGピン定義（ロゴのグラデーションを反映）
    // 通常ピン：カラフルな雫
    const gradientPinSvg = `
    <svg viewBox="0 0 30 42" width="30" height="42" class="pin-icon">
        <defs>
            <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#00b09b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#f6d365;stop-opacity:1" />
            </linearGradient>
            <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/></filter>
        </defs>
        <path d="M15 0C6.7 0 0 6.7 0 15c0 10 15 27 15 27s15-17 15-27c0-8.3-6.7-15-15-15z" fill="url(#pinGrad)" filter="url(#shadow)"/>
        <circle cx="15" cy="15" r="6" fill="white" fill-opacity="0.9"/>
    </svg>`;

    // 自分のピン：少し大きくて、星がついている特別版
    const myPinSvg = `
    <svg viewBox="0 0 40 56" width="40" height="56" class="my-icon-svg">
        <defs>
            <linearGradient id="myPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff5252;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#f6d365;stop-opacity:1" />
            </linearGradient>
        </defs>
        <path d="M20 0C9 0 0 9 0 20c0 13 20 36 20 36s20-23 20-36c0-11-9-20-20-20z" fill="url(#myPinGrad)"/>
        <circle cx="20" cy="20" r="8" fill="white"/>
        <path d="M20 14l1.5 4.5h4.5l-3.5 2.5 1.5 4.5-4-3-4 3 1.5-4.5-3.5-2.5h4.5z" fill="#ffb347"/>
    </svg>`;

    const gemIcon = L.divIcon({ className: 'custom-div-icon', html: gradientPinSvg, iconSize: [30, 42], iconAnchor: [15, 42], popupAnchor: [0, -42] });
    const myIcon = L.divIcon({ className: 'custom-div-icon', html: myPinSvg, iconSize: [40, 56], iconAnchor: [20, 56], popupAnchor: [0, -56] });
    
    const markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });

    async function init() {
        const loading = document.getElementById('loading');
        try {
            const response = await fetch(API_URL);
            allDreams = await response.json();
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);
            renderPins();
        } catch (e) {
            console.error(e);
            loading.innerHTML = "<div style='color:#333;'>Error Loading World</div>";
        }
    }
    init();

    function renderPins() {
        markers.clearLayers();
        // 自分のピンを個別に消すための処理（地図上の既存マーカーもクリア）
        map.eachLayer((layer) => {
            if (layer instanceof L.Marker && layer.options.icon === myIcon) {
                map.removeLayer(layer);
            }
        });
        
        myDreamCoords = null;

        for (const item of allDreams) {
            if (item.lat && item.lon) {
                let isMyDream = false;
                if (currentUser) {
                    if (item.uid && item.uid === currentUser.uid) {
                        isMyDream = true;
                    } else if (!item.uid && item.nickname === currentUser.displayName) {
                        isMyDream = true;
                    }
                }
                
                if (isMyDream) { myDreamCoords = [item.lat, item.lon]; }

                let popupHtml = `<div class="dream-popup-content"><div class="dream-popup-header"><span class="dream-nickname">${item.nickname}</span></div>`;
                if (item.image) popupHtml += `<img src="${item.image}" class="dream-img">`;
                popupHtml += `<div class="dream-body"><div class="dream-text">"${item.dream}"</div><div class="dream-address">📍 ${item.address}</div></div></div>`;
                
                if (isMyDream) {
                    // 自分の夢はクラスターに入れず、直接地図に追加して最前面にする
                    L.marker([item.lat, item.lon], { icon: myIcon, zIndexOffset: 1000 })
                        .bindPopup(popupHtml)
                        .addTo(map);
                } else {
                    // 他人の夢はこれまで通りクラスターに追加
                    const marker = L.marker([item.lat, item.lon], { icon: gemIcon }).bindPopup(popupHtml);
                    markers.addLayer(marker);
                }
            }
        }
        map.addLayer(markers);
    }

    function flyToMyDream() {
        if (myDreamCoords) { map.flyTo(myDreamCoords, 12, { duration: 2.0 }); } 
        else { alert("まだ夢が登録されていないようです。\nあなたの色を地図に加えましょう！"); }
    }

    async function submitDream() {
        const submitBtn = document.getElementById('submitBtn');
        const nickname = document.getElementById('inputName').value;
        const dream = document.getElementById('inputDream').value;
        const photoFile = document.getElementById('inputPhoto').files[0];
        const latLon = document.getElementById('inputLatLon').value;
        if(!dream) { alert("夢を入力してください"); return; }
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Uploading...";

        try {
            let photoUrl = "";
            if (photoFile) {
                const fileName = `dreams/${Date.now()}_${currentUser.uid}.jpg`;
                const storageRef = storage.ref().child(fileName);
                await storageRef.put(photoFile);
                photoUrl = await storageRef.getDownloadURL();
            }

            submitBtn.innerText = "Sending...";
            const [lat, lon] = latLon.split(',').map(s => s.trim());
            const data = { 
                nickname: nickname, 
                dream: dream, 
                address: latLon, 
                lat: lat, 
                lon: lon, 
                photoUrl: photoUrl, // GAS送信・DB保存用
                image: photoUrl,    // 画面表示用
                uid: currentUser.uid 
            };

            await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });

            allDreams.push(data);
            renderPins();
            document.getElementById('formView').style.display = 'none';
            document.getElementById('successView').style.display = 'block';

        } catch (e) {
            console.error(e);
            alert("エラーが発生しましたが、登録されている可能性があります。\n" + e.message);
            submitBtn.disabled = false;
        }
    }

    const modal = document.getElementById('registerModal');
    let isRegisterMode = false;
    function startRegistration() {
        isRegisterMode = true;
        document.getElementById('map').classList.add('crosshair-cursor');
        alert("【場所選択】\n地図上で、あなたの夢の拠点となる場所をクリックしてください。");
    }
    map.on('click', function(e) {
        if (!isRegisterMode) return;
        document.getElementById('inputLatLon').value = `${e.latlng.lat}, ${e.latlng.lng}`;
        document.getElementById('inputDream').value = "";
        document.getElementById('inputPhoto').value = "";
        document.getElementById('successView').style.display = 'none';
        
        if(currentUser) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        } else {
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('formView').style.display = 'none';
        }
        modal.classList.add('active');
        isRegisterMode = false;
        document.getElementById('map').classList.remove('crosshair-cursor');
    });
    function closeModal() {
        modal.classList.remove('active');
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = "夢を地図に刻む";
    }
    const bgm = document.getElementById('bgm');
    const dockMusic = document.querySelector('.dock-music');
    const statusText = document.getElementById('track-status');
    bgm.volume = 0.5;
    function toggleBGM() {
        if (bgm.paused) {
            bgm.play().then(() => { dockMusic.classList.add('playing'); statusText.innerText = "Now Playing"; }).catch(e=>{});
        } else {
            bgm.pause(); dockMusic.classList.remove('playing'); statusText.innerText = "Paused";
        }
    }
    function resetView() { map.flyTo([36.5, 138], 5, { duration: 2.0 }); }
</script>
</body>
</html>
