<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dream Quest 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Zen Maru Gothic', sans-serif; overflow: hidden; }
        .leaflet-tile-pane { filter: sepia(0.5) contrast(0.9) brightness(0.8) saturate(0.8); }
        #map { height: 100vh; width: 100%; z-index: 1; background: #2b2b2b; cursor: grab; }
        .crosshair-cursor { cursor: crosshair !important; }

        /* ガラス共通 */
        .glass-panel {
            background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); color: #fff;
        }

        /* タイトルエリア */
        .header-area { position: absolute; top: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .title-box { padding: 15px 20px; border-radius: 12px; max-width: 320px; pointer-events: auto; }
        .title-box h1 { margin: 0; font-size: 22px; font-family: 'DotGothic16', sans-serif; color: #ffeb3b; text-shadow: 0 0 10px rgba(255, 235, 59, 0.5); }
        .title-box p { margin: 5px 0 0; font-size: 12px; color: #ccc; font-family: 'DotGothic16', sans-serif; }

        /* ユーザープロフィール */
        .user-profile {
            display: none; align-items: center; gap: 10px; padding: 8px 15px; border-radius: 30px;
            background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(78, 255, 163, 0.5); width: fit-content; pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #4effa3; }
        .user-name { font-size: 12px; color: #fff; font-family: sans-serif; font-weight: bold; }
        
        /* 自分の夢へ飛ぶボタン */
        .fly-btn {
            background: rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 4px 10px;
            font-size: 11px; color: #ffeb3b; cursor: pointer; border: 1px solid #ffeb3b;
            font-family: 'DotGothic16', sans-serif; transition: all 0.2s;
        }
        .fly-btn:hover { background: #ffeb3b; color: #000; }
        
        .logout-btn { font-size: 10px; color: #aaa; text-decoration: underline; cursor: pointer; margin-left: 5px; }

        /* Dock */
        .dock {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 30px; padding: 6px 10px;
            display: flex; align-items: center; gap: 0; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); transition: all 0.3s ease;
        }
        .dock:hover { background: rgba(255, 255, 255, 0.2); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); transform: translateX(-50%) translateY(-2px); }
        .dock-divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.3); margin: 0 6px; flex-shrink: 0; }
        .dock-btn {
            width: 44px; height: 44px; border-radius: 50%; background: transparent; border: none;
            color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s ease; position: relative; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .dock-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.1); }
        .dock-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .dock-music {
            display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px;
            cursor: pointer; border-radius: 22px; transition: background 0.25s ease; flex-shrink: 0;
        }
        .dock-music:hover { background: rgba(255, 255, 255, 0.15); }
        .sound-wave { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
        .bar { width: 3px; background: rgba(255, 255, 255, 0.4); border-radius: 2px; height: 4px; transition: background 0.3s; }
        .dock-music.playing .bar { background: #4effa3; animation: equalizer 1s infinite ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.0s; } .bar:nth-child(2) { animation-delay: 0.2s; } .bar:nth-child(3) { animation-delay: 0.4s; } .bar:nth-child(4) { animation-delay: 0.1s; }
        @keyframes equalizer { 0% { height: 4px; } 50% { height: 18px; } 100% { height: 4px; } }
        .track-info { display: flex; flex-direction: column; line-height: 1.2; }
        .track-title { font-size: 12px; font-weight: bold; color: rgba(255, 255, 255, 0.7); font-family: sans-serif; }
        .track-status { font-size: 9px; color: rgba(255, 255, 255, 0.35); font-family: sans-serif; }
        .dock-music.playing .track-title { color: #4effa3; text-shadow: 0 0 8px rgba(78, 255, 163, 0.3); }

        /* モーダル */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 2000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .glass-modal {
            width: 90%; max-width: 400px; max-height: 85vh; background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 24px;
            color: #fff; display: flex; flex-direction: column; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: none; color: #fff; cursor: pointer; font-size: 18px;
        }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; font-family: 'DotGothic16', sans-serif; }
        .glass-input, .glass-textarea {
            width: 100%; box-sizing: border-box; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px; color: #fff; font-size: 16px;
        }
        .glass-input:focus, .glass-textarea:focus { outline: none; border-color: #4effa3; }
        .submit-btn {
            width: 100%; padding: 14px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #4effa3, #00b8d4); color: #000; font-weight: bold; cursor: pointer;
            font-family: 'DotGothic16', sans-serif; margin-top: 10px;
        }
        .submit-btn:disabled { background: #555; cursor: not-allowed; color: #888; }
        .login-required { text-align: center; padding: 20px; }
        .google-btn {
            background: #fff; color: #333; padding: 10px 20px; border-radius: 50px; border: none; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px auto; cursor: pointer;
        }

        /* ポップアップ */
        .leaflet-popup-content-wrapper { background: rgba(253, 246, 227, 0.95); backdrop-filter: blur(5px); border: 2px solid #8b5a2b; border-radius: 8px; padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .leaflet-popup-tip { background: #8b5a2b; }
        .dream-popup-header { background: #8b5a2b; padding: 12px; text-align: center; border-bottom: 1px dashed #d4af37; }
        .dream-nickname { font-family: 'DotGothic16', sans-serif; font-size: 16px; color: #ffeb3b; }
        .dream-body { padding: 15px; text-align: center; color: #5c4033; }
        .dream-text { font-size: 16px; font-weight: bold; margin-bottom: 12px; font-family: 'Zen Maru Gothic', sans-serif; }
        .dream-address { font-size: 10px; color: #8a6e58; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 8px; }
        .dream-img { width: calc(100% - 16px); margin: 8px auto; height: 160px; object-fit: cover; border: 2px solid #fff; transform: rotate(-1deg); border-radius: 4px; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #d4af37; font-family: 'DotGothic16', sans-serif; transition: opacity 0.5s; }
        
        /* アイコン設定 */
        .gem-icon { font-size: 26px; text-align: center; line-height: 30px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); transition: transform 0.2s; }
        .gem-icon:hover { transform: scale(1.3); filter: drop-shadow(0 0 10px rgba(255, 235, 59, 0.8)); }
        
        /* 自分のアイコン (王冠) */
        .my-icon { font-size: 32px; text-align: center; line-height: 36px; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8)); animation: float 2s infinite ease-in-out; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

<audio id="bgm" loop><source src="bgm.mp3" type="audio/mp3"></audio>
<div id="loading"><div>WORLD LOADING...</div></div>

<div class="header-area">
    <div class="title-box glass-panel">
        <h1>💎 DREAM QUEST</h1>
        <p>世界中に散らばる2026個の夢。</p>
    </div>
    <div id="userProfile" class="user-profile">
        <img id="userAvatar" class="user-avatar" src="" alt="user">
        <span id="userName" class="user-name"></span>
        <span class="fly-btn" onclick="flyToMyDream()">🚀 My Dream</span>
        <span class="logout-btn" onclick="logout()">Log out</span>
    </div>
</div>

<div class="dock">
    <button class="dock-btn reset" onclick="resetView()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></button>
    <div class="dock-divider"></div>
    <div class="dock-music" onclick="toggleBGM()">
        <div class="sound-wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="track-info"><div class="track-title">Dream Quest OST</div><div class="track-status" id="track-status">Tap to Play</div></div>
    </div>
    <div class="dock-divider"></div>
    <button class="dock-btn register" onclick="startRegistration()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
</div>

<div class="modal-overlay" id="registerModal">
    <div class="glass-modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div id="loginView" class="login-required">
            <h2>LOGIN REQUIRED</h2>
            <p style="font-size:12px; color:#ccc;">冒険の記録を残すには<br>ログインが必要です。</p>
            <button class="google-btn" onclick="login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Googleでログイン
            </button>
        </div>
        <div id="formView" style="display:none;">
            <h2 style="text-align:center; font-family:'DotGothic16', sans-serif; color:#4effa3; margin-top:0;">DREAM ENTRY</h2>
            <div class="form-group"><label class="form-label">NICKNAME</label><input type="text" id="inputName" class="glass-input" placeholder="冒険者名" required></div>
            <div class="form-group"><label class="form-label">YOUR DREAM</label><textarea id="inputDream" class="glass-textarea" placeholder="35歳でファイヤー！..." required></textarea></div>
            <div class="form-group"><label class="form-label">PHOTO (画像アップロード)</label><input type="file" id="inputPhoto" class="glass-input" accept="image/*"><p style="font-size:10px; color:#aaa; margin-top:5px;">※画像は自動で圧縮保存されます</p></div>
            <input type="hidden" id="inputLatLon">
            <button id="submitBtn" class="submit-btn" onclick="submitDream()">CAST MAGIC (送信)</button>
        </div>
        <div id="successView" style="display:none; text-align:center; padding:40px 0;">
            <span class="success-icon" style="font-size:60px;">💎</span>
            <div style="font-size:18px; font-weight:bold; color:#4effa3; margin:20px 0;">夢が地図に刻まれました！</div>
            <button class="submit-btn" onclick="closeModal()" style="background:#555; color:#fff;">閉じる</button>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
    // ▼▼▼ 設定エリア ▼▼▼
    
    // 1. GASのURL
    const API_URL = "https://script.google.com/macros/s/AKfycbyHL2RHcFwUSELpPxxmyP_dZuKeKJq_rj5gM-FLEfYSs7fk4Jkezjkgt-YlHutvCKfr/exec";

    // 2. Firebaseの設定
    const firebaseConfig = {
        apiKey: "AIzaSyAgS7KaT_iTuvrtBfggMRUCHBqcvqrShWQ",
        authDomain: "dream-quest-2026.firebaseapp.com",
        projectId: "dream-quest-2026",
        storageBucket: "dream-quest-2026.firebasestorage.app",
        messagingSenderId: "98720277386",
        appId: "1:98720277386:web:90b5564816ec9f1ab75e73"
    };
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const storage = firebase.storage();
    let currentUser = null;
    let allDreams = []; // 夢データを保存しておく場所
    let myDreamCoords = null; // 自分の夢の座標

    // 認証監視
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('userAvatar').src = user.photoURL;
            document.getElementById('userName').innerText = user.displayName;
            document.getElementById('inputName').value = user.displayName;
            
            if(document.getElementById('registerModal').classList.contains('active')){
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('formView').style.display = 'block';
            }
            // ログインしたので地図を再描画（自分のピンを王冠にするため）
            renderPins();
        } else {
            currentUser = null;
            myDreamCoords = null;
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('formView').style.display = 'none';
            // ログアウトしたので地図を再描画（王冠をダイヤに戻す）
            renderPins();
        }
    });

    function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result)=>{
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        }).catch((error) => alert("ログインエラー: " + error.message));
    }
    function logout() { auth.signOut(); closeModal(); }

    const map = L.map('map', { zoomControl: false }).setView([36.5, 138], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO', maxZoom: 20 }).addTo(map);

    // アイコン定義
    const gemIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="gem-icon">💎</div>', iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -15] });
    const myIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="my-icon">👑</div>', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20] });
    
    const markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });

    // データ取得
    async function init() {
        const loading = document.getElementById('loading');
        try {
            const response = await fetch(API_URL);
            allDreams = await response.json(); // グローバル変数に保存
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);
            
            renderPins(); // ピンを描画

        } catch (e) {
            console.error(e);
            loading.innerHTML = "<div>Error Loading World</div>";
        }
    }
    init();

    // ピン描画関数 (ログイン状態によって出し分ける)
    function renderPins() {
        markers.clearLayers(); // 一旦全部消す
        myDreamCoords = null; // リセット

        for (const item of allDreams) {
            if (item.lat && item.lon) {
                let isMyDream = false;
                
                // 自分の夢か判定（UIDで確実に判定。古いデータはニックネームでフォールバック）
                if (currentUser) {
                    if (item.uid && item.uid === currentUser.uid) {
                        isMyDream = true; // UIDが一致すれば確実！
                    } else if (!item.uid && item.nickname === currentUser.displayName) {
                        isMyDream = true; // UIDがない古いデータは名前で判定
                    }
                }

                if (isMyDream) {
                    myDreamCoords = [item.lat, item.lon];
                }

                let popupHtml = `<div class="dream-popup-content"><div class="dream-popup-header"><span class="dream-nickname">Lv.1 ${item.nickname}</span></div>`;
                if (item.image) popupHtml += `<img src="${item.image}" class="dream-img">`;
                popupHtml += `<div class="dream-body"><div class="dream-text">"${item.dream}"</div><div class="dream-address">🗺 ${item.address}</div></div></div>`;
                
                // アイコンを使い分け
                const iconToUse = isMyDream ? myIcon : gemIcon;
                const marker = L.marker([item.lat, item.lon], { icon: iconToUse }).bindPopup(popupHtml);
                markers.addLayer(marker);
            }
        }
        map.addLayer(markers);
    }

    // 自分の夢へジャンプ
    function flyToMyDream() {
        if (myDreamCoords) {
            map.flyTo(myDreamCoords, 12, { duration: 2.0 });
        } else {
            alert("まだ夢が登録されていないか、ニックネームが一致しません。\n登録してみてください！");
        }
    }

    async function submitDream() {
        const submitBtn = document.getElementById('submitBtn');
        const nickname = document.getElementById('inputName').value;
        const dream = document.getElementById('inputDream').value;
        const photoFile = document.getElementById('inputPhoto').files[0];
        const latLon = document.getElementById('inputLatLon').value;
        if(!dream) { alert("夢を入力してください！"); return; }
        
        submitBtn.disabled = true;
        submitBtn.innerText = "UPLOADING...";

        try {
            let photoUrl = "";
            if (photoFile) {
                const fileName = `dreams/${Date.now()}_${currentUser.uid}.jpg`;
                const storageRef = storage.ref().child(fileName);
                await storageRef.put(photoFile);
                photoUrl = await storageRef.getDownloadURL();
            }

            submitBtn.innerText = "SENDING DATA...";
            const [lat, lon] = latLon.split(',').map(s => s.trim());
            const data = {
                nickname: nickname,
                dream: dream,
                address: latLon,
                lat: lat,
                lon: lon,
                photoUrl: photoUrl,
                uid: currentUser.uid // Firebase固有のユーザーID（安全な身分証明書）
            };

            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            // 成功したらローカルデータにも追加して即座に反映させる
            allDreams.push(data);
            renderPins();

            document.getElementById('formView').style.display = 'none';
            document.getElementById('successView').style.display = 'block';

        } catch (e) {
            console.error(e);
            alert("送信処理でエラーが発生しましたが、登録されている可能性があります。\n" + e.message);
            submitBtn.disabled = false;
        }
    }

    const modal = document.getElementById('registerModal');
    let isRegisterMode = false;
    function startRegistration() {
        isRegisterMode = true;
        document.getElementById('map').classList.add('crosshair-cursor');
        alert("【場所選択モード】\n地図上で、夢を登録したい場所をクリックしてください！");
    }
    map.on('click', function(e) {
        if (!isRegisterMode) return;
        document.getElementById('inputLatLon').value = `${e.latlng.lat}, ${e.latlng.lng}`;
        document.getElementById('inputDream').value = "";
        document.getElementById('inputPhoto').value = "";
        document.getElementById('successView').style.display = 'none';
        
        if(currentUser) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        } else {
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('formView').style.display = 'none';
        }
        modal.classList.add('active');
        isRegisterMode = false;
        document.getElementById('map').classList.remove('crosshair-cursor');
    });
    function closeModal() {
        modal.classList.remove('active');
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = "CAST MAGIC (送信)";
    }
    const bgm = document.getElementById('bgm');
    const dockMusic = document.querySelector('.dock-music');
    const statusText = document.getElementById('track-status');
    bgm.volume = 0.5;
    function toggleBGM() {
        if (bgm.paused) {
            bgm.play().then(() => { dockMusic.classList.add('playing'); statusText.innerText = "Now Playing"; }).catch(e=>{});
        } else {
            bgm.pause(); dockMusic.classList.remove('playing'); statusText.innerText = "Paused";
        }
    }
    function resetView() { map.flyTo([36.5, 138], 5, { duration: 2.0 }); }
</script>
